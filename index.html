<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b7a75" />
  <title>GisBi Web</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <img src="icons/icon.svg" alt="GisBi" />
        <div>
          <strong>GisBi Web</strong>
          <span>نسخة Safari/PWA</span>
        </div>
      </div>
      <div class="actions">
        <button id="locateBtn" title="موقعي">📍</button>
        <button id="listBtn" title="النقاط">☰</button>
      </div>
    </header>

    <main>
      <div id="map"></div>
      <div id="hint">اضغط على الخريطة لإضافة نقطة جديدة</div>
    </main>
  </div>

  <section id="pointModal" class="modal hidden" aria-hidden="true">
    <div class="card">
      <h2>إضافة نقطة</h2>
      <label>اسم النقطة
        <input id="name" type="text" placeholder="مثال: عقار، محل، مزرعة" />
      </label>
      <label>ملاحظة
        <textarea id="note" rows="3" placeholder="تفاصيل اختيارية"></textarea>
      </label>
      <div class="coords" id="coords"></div>
      <div class="row">
        <button id="cancelPoint" class="secondary">إلغاء</button>
        <button id="savePoint">حفظ</button>
      </div>
    </div>
  </section>

  <aside id="drawer" class="hidden" aria-hidden="true">
    <div class="drawer-card">
      <div class="drawer-head">
        <h2>النقاط المحفوظة</h2>
        <button id="closeDrawer" class="icon-btn">×</button>
      </div>
      <input id="search" type="search" placeholder="بحث بالاسم أو الملاحظة" />
      <div class="row small-gap">
        <button id="exportBtn" class="secondary">تصدير JSON</button>
        <button id="clearBtn" class="danger secondary">مسح الكل</button>
      </div>
      <div id="pointsList" class="list"></div>
    </div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
